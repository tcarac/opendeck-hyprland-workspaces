name: Bug report
description: Report a reproducible OpenDeck/Hyprland issue
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Omarchy/Hyprland version, OpenDeck version/install type, controller model
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and logs
      description: Steps and sanitized logs (remove tokens and private paths)
    validations:
      required: true
